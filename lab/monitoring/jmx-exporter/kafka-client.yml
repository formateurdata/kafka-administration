# ---------------------------------------------------------------------------
# Regles Prometheus JMX exporter pour les CLIENTS Kafka (producteurs et
# consommateurs Java). Utilise par loadgen-producer et loadgen-consumer.
# Point d'exposition : http://loadgen-producer:9404/metrics
#
# Exemples de series produites :
#   kafka_producer_producer_metrics_record_send_rate{client_id="loadgen-producer"}
#   kafka_consumer_consumer_fetch_manager_metrics_records_lag_max{client_id=...}
#   kafka_consumer_consumer_fetch_manager_metrics_records_lag{topic=...,partition=...}
# ---------------------------------------------------------------------------
lowercaseOutputName: true
lowercaseOutputLabelNames: true

rules:
  # Metriques par partition (lag du consommateur par partition).
  - pattern: kafka.(producer|consumer)<type=(.+), client-id=(.+), topic=(.+), partition=(.+)><>([a-z-]+)
    name: kafka_$1_$2_$6
    type: GAUGE
    labels:
      client_id: "$3"
      topic: "$4"
      partition: "$5"
  # Metriques par topic.
  - pattern: kafka.(producer|consumer)<type=(.+), client-id=(.+), topic=(.+)><>([a-z-]+)
    name: kafka_$1_$2_$5
    type: GAUGE
    labels:
      client_id: "$3"
      topic: "$4"
  # Metriques par broker contacte.
  - pattern: kafka.(producer|consumer)<type=(.+), client-id=(.+), node-id=(.+)><>([a-z-]+)
    name: kafka_$1_$2_$5
    type: GAUGE
    labels:
      client_id: "$3"
      node_id: "$4"
  # Metriques globales du client.
  - pattern: kafka.(producer|consumer)<type=(.+), client-id=(.+)><>([a-z-]+)
    name: kafka_$1_$2_$4
    type: GAUGE
    labels:
      client_id: "$3"
