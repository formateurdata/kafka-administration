# MODELE de configuration client pour le listener SECURE (SASL_SSL + SCRAM).
# Copier dans /tmp puis completer les valeurs entre < >.
#   cp /opt/lab/clients/secure-template.properties /tmp/bob.properties
security.protocol=<protocole du listener SECURE>
sasl.mechanism=<mecanisme SASL active sur le listener>
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="<utilisateur>" password="<mot de passe>";
ssl.truststore.type=PKCS12
ssl.truststore.location=/opt/lab/secrets/truststore.p12
ssl.truststore.password=novashop-lab
client.id=<identifiant de l'application>
