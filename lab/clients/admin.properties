# Compte d'administration sur le listener SECURE (kafka-N:19094).
# Usage : kafka-topics.sh --bootstrap-server $BS_SECURE --command-config clients/admin.properties ...
# Prerequis (TP5) : identifiants SCRAM de "admin" crees avec kafka-configs.sh.
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin-secret";
# Le client verifie le certificat du broker avec la CA du lab.
ssl.truststore.type=PKCS12
ssl.truststore.location=/opt/lab/secrets/truststore.p12
ssl.truststore.password=novashop-lab
# ssl.endpoint.identification.algorithm=https (defaut) : le nom d'hote
# kafka-N doit figurer dans le certificat du broker (SAN).
