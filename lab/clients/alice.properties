# Application "orders-service" (equipe Commandes) : produit dans le topic orders.
# Utilisateur SCRAM : alice. Listener SECURE (SASL_SSL).
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="alice" password="alice-secret";
ssl.truststore.type=PKCS12
ssl.truststore.location=/opt/lab/secrets/truststore.p12
ssl.truststore.password=novashop-lab
client.id=orders-service
