# ---------------------------------------------------------------------------
# Kafka Connect (mode distribue) - lab NovaShop, demo D3
# Lance par : connect-distributed.sh /opt/lab/connect/connect-distributed.properties
# API REST : http://localhost:8083
# ---------------------------------------------------------------------------

bootstrap.servers=kafka-1:19092,kafka-2:19092,kafka-3:19092

# Identifiant du cluster Connect : les workers de meme group.id se partagent
# les connecteurs et les taches (un seul worker dans le lab).
group.id=novashop-connect

# Topics internes de Connect : configuration des connecteurs, offsets
# des sources, statut des taches. Compactes et repliques 3 fois.
config.storage.topic=_connect-configs
offset.storage.topic=_connect-offsets
status.storage.topic=_connect-status
config.storage.replication.factor=3
offset.storage.replication.factor=3
status.storage.replication.factor=3
offset.storage.partitions=5
status.storage.partitions=3

# Format des messages ecrits dans Kafka : JSON sans enveloppe de schema.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# API REST et adresse annoncee aux autres workers.
listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect
rest.advertised.port=8083

# Plugins : le connecteur FileStream est livre avec Apache Kafka mais n'est
# plus dans le classpath par defaut depuis Kafka 3.2 : on le declare ici.
plugin.path=/opt/kafka/libs/connect-file-4.3.2.jar

offset.flush.interval.ms=10000
