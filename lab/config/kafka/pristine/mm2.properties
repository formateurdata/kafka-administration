# ------------------------------------------------------------------
# MirrorMaker 2 en mode dedie (connect-mirror-maker.sh), TP9.
#
# Recopie les topics du cluster "onprem" (kafka-1 a kafka-3) vers le
# cluster "cloud" (kafka-cloud), qui joue le role d'un cluster gere
# (AWS MSK par exemple).
#
# Les reglages marques [LAB] sont adaptes a un cluster cible d'un seul
# broker et a l'observation rapide pendant le TP.
# ------------------------------------------------------------------

# --- 1. Les clusters et leurs alias --------------------------------
# L'alias sert de prefixe aux topics recopies : orders devient onprem.orders.
clusters = onprem, cloud

onprem.bootstrap.servers = kafka-1:19092,kafka-2:19092,kafka-3:19092

# Le cluster cible n'accepte que des clients authentifies (SASL_SSL + SCRAM).
cloud.bootstrap.servers = kafka-cloud:9096
cloud.security.protocol = SASL_SSL
cloud.sasl.mechanism = SCRAM-SHA-512
cloud.sasl.jaas.config = org.apache.kafka.common.security.scram.ScramLoginModule required username="mm2" password="mm2-secret";
cloud.ssl.truststore.type = PKCS12
cloud.ssl.truststore.location = /opt/lab/secrets/truststore.p12
cloud.ssl.truststore.password = novashop-lab

# --- 2. Le flux de replication -------------------------------------
# Un seul sens : onprem vers cloud.
onprem->cloud.enabled = true
cloud->onprem.enabled = false
# Meme desactive, un sens emet par defaut des heartbeats : MirrorMaker 2
# creerait alors le topic heartbeats et ses topics internes mm2-*.cloud.internal
# sur le cluster onprem. On l'interdit pour ne rien ecrire sur la source.
cloud->onprem.emit.heartbeats.enabled = false

# Topics recopies (liste ou expressions regulieres).
onprem->cloud.topics = orders, payments

# Groupes de consommateurs dont les offsets sont suivis (checkpoints).
onprem->cloud.groups = .*

# --- 3. Offsets des consommateurs ----------------------------------
# Ecrit les offsets traduits directement dans les groupes du cluster cible,
# a condition qu'aucun consommateur du groupe n'y soit actif.
onprem->cloud.sync.group.offsets.enabled = true
# [LAB] 5 s au lieu de 60 s par defaut, pour observer rapidement.
onprem->cloud.sync.group.offsets.interval.seconds = 5
onprem->cloud.emit.checkpoints.interval.seconds = 5
onprem->cloud.refresh.topics.interval.seconds = 10
onprem->cloud.refresh.groups.interval.seconds = 10
# Recopie des configurations de topic (retention.ms, cleanup.policy...).
# [LAB] 10 s au lieu de 10 min par defaut.
onprem->cloud.sync.topic.configs.interval.seconds = 10

# Les ACL ne sont pas recopiees (sinon le compte mm2 doit pouvoir les
# creer sur le cluster cible).
sync.topic.acls.enabled = false

# --- 4. Topics internes --------------------------------------------
# offset-syncs : correspondance entre offsets source et cible. Place sur le
# cluster cible : MirrorMaker 2 n'ecrit rien sur le cluster source.
offset-syncs.topic.location = target

# [LAB] le cluster cible n'a qu'un broker : facteur de replication 1.
# En production : 3, comme pour tout topic.
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
config.storage.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
