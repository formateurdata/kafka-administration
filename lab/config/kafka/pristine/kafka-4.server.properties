############################################################################
# NovaShop - cluster de formation Kafka 4.3 (mode KRaft)
# Noeud : kafka-4   |   Role : broker seul (ajoute au TP7, profil scale)
#
# Les reglages marques [LAB] sont adaptes a un portable de formation.
# Ils ne doivent pas etre repris tels quels en production.
# Voir lab/ARCHITECTURE.md, section "Lab et production".
############################################################################

# ==========================================================================
# 1. Identite et roles KRaft
# ==========================================================================
# broker = ce noeud stocke des partitions mais ne vote pas dans le quorum.
# Il lit les metadonnees aupres des controleurs kafka-1, kafka-2, kafka-3.
process.roles=broker
# Identifiant unique du noeud dans le cluster (broker.id n'existe plus en KRaft).
node.id=4
# Points de contact du quorum de controleurs (quorum dynamique, KIP-853).
# Remplace controller.quorum.voters (quorum statique) depuis Kafka 3.9.
controller.quorum.bootstrap.servers=kafka-1:9093,kafka-2:9093,kafka-3:9093
# Listener a utiliser pour joindre les controleurs (non ouvert sur ce noeud).
controller.listener.names=CONTROLLER
# Zone de disponibilite simulee (rack awareness).
broker.rack=az-a

# ==========================================================================
# 2. Listeners
# ==========================================================================
# listeners            : adresses sur lesquelles le noeud ECOUTE.
# advertised.listeners : adresses que le noeud COMMUNIQUE aux clients dans
#                        les metadonnees. Le client se reconnecte ensuite a
#                        ces adresses : elles doivent etre joignables par lui.
#
#   (pas de listener CONTROLLER : ce noeud n'est pas controleur)
#   INTERNAL   19092   inter-broker, outils, Kafka UI, exporters
#   EXTERNAL    9392   clients sur la machine hote (localhost:9392)
#   SECURE     19094   clients authentifies, SASL_SSL + SCRAM-SHA-512
listeners=INTERNAL://:19092,EXTERNAL://:9392,SECURE://:19094
advertised.listeners=INTERNAL://kafka-4:19092,EXTERNAL://localhost:9392,SECURE://kafka-4:19094
listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,SECURE:SASL_SSL
inter.broker.listener.name=INTERNAL

# ==========================================================================
# 3. Securite du listener SECURE (TP5)
# ==========================================================================
# Authentification : SCRAM-SHA-512. Les identifiants sont stockes dans les
# metadonnees KRaft (kafka-configs.sh --entity-type users).
listener.name.secure.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.secure.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
# Chiffrement : certificat du noeud signe par la CA du lab (security/).
listener.name.secure.ssl.keystore.type=PKCS12
listener.name.secure.ssl.keystore.location=/opt/lab/secrets/kafka-4.keystore.p12
listener.name.secure.ssl.keystore.password=novashop-lab
listener.name.secure.ssl.key.password=novashop-lab
listener.name.secure.ssl.truststore.type=PKCS12
listener.name.secure.ssl.truststore.location=/opt/lab/secrets/truststore.p12
listener.name.secure.ssl.truststore.password=novashop-lab
# none : pas de certificat client exige (mTLS = variante avancee du TP5).
listener.name.secure.ssl.client.auth=none

# Autorisation : ACL stockees dans les metadonnees KRaft.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
# [LAB] ANONYMOUS est super-utilisateur : les listeners PLAINTEXT (INTERNAL,
# EXTERNAL, CONTROLLER) n'authentifient personne et doivent rester ouverts
# pour les TP 1 a 4. En production : aucun listener anonyme, et
# super.users limite aux comptes techniques des brokers et des admins.
super.users=User:admin;User:ANONYMOUS
# Sans ACL sur une ressource, l'acces est refuse (comportement par defaut).
allow.everyone.if.no.acl.found=false

# ==========================================================================
# 4. Stockage
# ==========================================================================
# Repertoire(s) des donnees : partitions et metadonnees KRaft.
# TP7 : ajout d'un second repertoire (/var/lib/kafka/data2).
log.dirs=/var/lib/kafka/data
num.recovery.threads.per.data.dir=2

# ==========================================================================
# 5. Valeurs par defaut des topics
# ==========================================================================
num.partitions=3
default.replication.factor=3
# Un topic ne doit jamais etre cree implicitement par un client.
auto.create.topics.enable=false
unclean.leader.election.enable=false
# min.insync.replicas n'est PAS defini ici : avec Eligible Leader Replicas
# (ELR, KIP-966, actif par defaut depuis Kafka 4.1), il se regle au niveau
# du cluster ou du topic. Valeur par defaut de Kafka : 1. Voir TP4 :
#   kafka-configs.sh --alter --entity-type brokers --entity-default \
#     --add-config min.insync.replicas=2
# Topics internes : offsets des groupes, transactions, share groups.
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
share.coordinator.state.topic.replication.factor=3
share.coordinator.state.topic.min.isr=2

# ==========================================================================
# 6. Retention et segments
# ==========================================================================
log.retention.hours=168
log.segment.bytes=1073741824
# [LAB] verification de la retention toutes les 30 s (defaut : 5 min)
# pour observer la suppression des segments pendant les TP.
log.retention.check.interval.ms=30000

# ==========================================================================
# 7. Groupes de consommateurs
# ==========================================================================
# [LAB] pas d'attente avant le premier rebalance (defaut : 3 s).
group.initial.rebalance.delay.ms=0

# ==========================================================================
# 8. Threads reseau et E/S
# ==========================================================================
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
