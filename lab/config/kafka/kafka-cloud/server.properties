############################################################################
# NovaShop - cluster "cloud" (cible de MirrorMaker 2, TP9)
# Noeud : kafka-cloud   |   Roles : broker + controleur, noeud unique
#
# Ce cluster joue le role d'un cluster gere dans le cloud (AWS MSK par
# exemple) : MirrorMaker 2 y recopie les topics du cluster "onprem"
# (kafka-1 a kafka-3). Il a son propre identifiant de cluster.
#
# Les reglages marques [LAB] sont adaptes a un portable de formation.
# Un cluster de production compte au moins 3 brokers, repartis sur
# 3 zones de disponibilite. Voir lab/ARCHITECTURE.md.
############################################################################

# ==========================================================================
# 1. Identite et roles KRaft
# ==========================================================================
# [LAB] noeud unique, broker et controleur : quorum d'un seul votant.
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=kafka-cloud:9093
controller.listener.names=CONTROLLER

# ==========================================================================
# 2. Listeners
# ==========================================================================
#   CONTROLLER  9093   quorum KRaft
#   INTERNAL   19092   outils d'administration du lab (conteneur tools)
#   SECURE      9096   clients authentifies, SASL_SSL + SCRAM-SHA-512
#                      (9096 est le port SASL/SCRAM des brokers AWS MSK)
listeners=CONTROLLER://:9093,INTERNAL://:19092,SECURE://:9096
advertised.listeners=CONTROLLER://kafka-cloud:9093,INTERNAL://kafka-cloud:19092,SECURE://kafka-cloud:9096
listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,SECURE:SASL_SSL
inter.broker.listener.name=INTERNAL

# ==========================================================================
# 3. Securite du listener SECURE
# ==========================================================================
# Identifiants SCRAM du compte mm2 crees au formatage du stockage
# (kafka-storage.sh format --add-scram, voir start-cloud.sh).
listener.name.secure.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.secure.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.secure.ssl.keystore.type=PKCS12
listener.name.secure.ssl.keystore.location=/opt/lab/secrets/kafka-cloud.keystore.p12
listener.name.secure.ssl.keystore.password=novashop-lab
listener.name.secure.ssl.key.password=novashop-lab
listener.name.secure.ssl.truststore.type=PKCS12
listener.name.secure.ssl.truststore.location=/opt/lab/secrets/truststore.p12
listener.name.secure.ssl.truststore.password=novashop-lab
listener.name.secure.ssl.client.auth=none

authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
# [LAB] ANONYMOUS est super-utilisateur pour le listener INTERNAL des outils.
# Le compte mm2 n'a que les droits donnes par ACL.
super.users=User:admin;User:ANONYMOUS
allow.everyone.if.no.acl.found=false

# ==========================================================================
# 4. Stockage
# ==========================================================================
log.dirs=/var/lib/kafka/data

# ==========================================================================
# 5. Valeurs par defaut des topics
# ==========================================================================
# [LAB] un seul broker : facteur de replication 1 partout.
num.partitions=3
default.replication.factor=1
auto.create.topics.enable=false
unclean.leader.election.enable=false
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# ==========================================================================
# 6. Retention et groupes
# ==========================================================================
log.retention.hours=168
# [LAB] memes reglages que le cluster onprem.
log.retention.check.interval.ms=30000
group.initial.rebalance.delay.ms=0
